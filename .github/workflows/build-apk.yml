name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan struktur Android
        run: |
          mkdir -p app/src/main/java/com/example/spacemanpredictor
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          mv MainActivity.java app/src/main/java/com/example/spacemanpredictor/MainActivity.java
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv activity_main.xml app/src/main/res/layout/activity_main.xml
          mv styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.spacemanpredictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.spacemanpredictor'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: SpacemanPredictor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
